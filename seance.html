    verrouEcran.addEventListener("release", () => { verrouEcran = null; document.documentElement.dataset.ecran = "relache"; });
  } catch (e) { verrouEcran = null; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") garderEcranAllume(); });
document.addEventListener("pointerdown", () => { contexteAudio(); garderEcranAllume(); }, { passive: true, capture: true });
// Service worker (si seance-sw.js est en ligne à côté de la page, en HTTPS) : la page se rouvre
// sans réseau. Portée = cette page seule : rien d'autre du site n'est touché.
function installerHorsLigne() {
  const racine = document.documentElement;
  try {
    if (!("serviceWorker" in navigator) || !window.isSecureContext || !/^https?:$/.test(location.protocol)) { racine.dataset.sw = "non"; return; }
    if (navigator.serviceWorker.controller) racine.dataset.swControle = "oui";  // page servie par le service worker
    navigator.serviceWorker.register("seance-sw.js", { scope: location.pathname })
      .then(() => { racine.dataset.sw = "actif"; }, () => { racine.dataset.sw = "absent"; });
  } catch (e) { racine.dataset.sw = "non"; }
}

async function lireFiche() {
  const z = params.get("z"), p = params.get("p");
  if (z) {
    if (!("DecompressionStream" in window)) throw new Error("Ton Telegram est trop ancien pour ouvrir cette séance : mets-le à jour, ou tape /fiche pour l'avoir en texte.");
    const flux = new Blob([b64(z)]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return JSON.parse(await new Response(flux).text());
  }
  if (p) return JSON.parse(new TextDecoder().decode(b64(p)));
  throw new Error("Pas de séance dans le bouton. Demande-la à Marion, puis retouche « 💪 Séance ».");
}

// Exercice : bibliothèque de la page + ce que la séance précise.
function ex(x) {
  if (!x) return null;
  const b = BIB[x.i] || {};
  return { i: x.i, n: x.n || b.n || x.i, m: x.m || b.m || "", u: x.u || b.u || "r", b: x.b || b.b || "", ev: x.ev || b.ev || "" };
}

function monProfil() { return profils().find(p => p.id === S.profil) || profils()[0]; }
function val(d) {
  const f = (v) => d.u === "s" ? duree(v) : String(v);
  return d.z && d.z !== d.a ? (d.u === "s" ? f(d.a) + " à " + f(d.z) : d.a + "-" + d.z) : f(d.a);
}
function doseTxt(d) {
  if (!d) return "—";
  const v = val(d);
  if (d.s > 1) return d.s + " × " + v;
  return d.u === "r" ? (d.z && d.z !== d.a ? d.a + " à " + d.z : d.a) + (Math.max(d.a, d.z || 0) > 1 ? " reps" : " rep") : v;
}

// Groupe : chacun démarre sur un poste différent (« Toi A→B→C · Pote B→C→A · Amie C→A→B »).
function rotation(b) {
  const ps = profils(), n = b.po.length;

// ------------------------------------------------------------------ bilan
function construireBilan(avecNomsComplets) {
  const ex2 = [], index = {}, echauffement = new Set();
  const ajoute = (cleB, e, ie, sets, done, reps, sec, kg, t, at) => {
    let r = index[cleB];
    if (!r) { r = index[cleB] = { i: ex2.length + 1, id: e.i, name: e.n.slice(0, 40), nc: e.n, e: ie + 1, sets: 0, done: 0, reps: 0, sec: 0, k: e.u === "s" ? "s" : "r", t }; ex2.push(r); }
    if (cleB.split(".").length > 3) echauffement.add(r);  // poste de circuit (une ligne par variante)
    r.sets += sets; r.done += done; r.reps += reps; r.sec += sec;
    if (kg) r.kg = Math.max(r.kg || 0, kg);
    if (at) r.at = Math.max(r.at || 0, at);
  };
  ECRANS.forEach(sc => {
    if (!["c", "x", "s"].includes(sc.k)) return;
    const b = bloc(sc), k = cleEcran(sc);
    if (sc.k === "c") {
      const at = S.tours[k] || 0;
      b.po.forEach((po, ip) => {
        const base = ex(po.x), va = po.va && po.va.length ? ex(po.va[(sc.t - 1) % po.va.length]) : null, e = va || base;
        const d = po.d[S.profil] || po.d[profils()[0].id], v = d.a;
        ajoute(sc.ie + "." + sc.ib + "." + ip + "." + e.i, e, sc.ie, 1, at ? 1 : 0, at && d.u !== "s" ? v : 0, at && d.u === "s" ? v : 0, 0, v, at);
      });
    } else if (sc.k === "x") {
      const faites = S.series[k] || [], e = exerciceCourant(sc), d = b.d[S.profil] || b.d[profils()[0].id];
      const somme = faites.reduce((t, f) => t + (f.reps || 0), 0);
      ajoute(k + "." + e.i, e, sc.ie, d.s, faites.length, d.u === "s" ? 0 : somme, d.u === "s" ? somme : 0,
        Math.max(0, ...faites.map(f => f.kg || 0)), Math.max(d.a, d.z || 0), faites.length ? faites[faites.length - 1].at : 0);
      // Détail série par série (reps, kg, ressenti) : meilleure série, force estimée et charge suivante côté bot.
      const r = index[k + "." + e.i];
      if (d.z && d.z !== d.a && d.u !== "s") r.tn = d.a;  // bas de la fourchette : en dessous = échec
      if (faites.length) r.ss = (r.ss || []).concat(faites.map(f => f.dif ? [f.reps || 0, f.kg || 0, f.dif] : [f.reps || 0, f.kg || 0]));
    } else {
      const faites = S.series[k] || [], d = b.d[S.profil] || b.d[profils()[0].id];
      b.xs.forEach((x, j) => {
        const e = ex(x), dj = d[j], n = faites.length;
        ajoute(k + "." + j + "." + e.i, e, sc.ie, dj.s, n, dj.u === "s" ? 0 : n * dj.a, dj.u === "s" ? n * dj.a : 0, 0, dj.a, n ? faites[n - 1].at : 0);
      });
    }
  });
  if (!avecNomsComplets) ex2.forEach(e => delete e.nc);
  // Identifiant STABLE (séance + personne) : renvoyer ou « recommencer à zéro » ne crée plus de doublon.
  const bilan = {
    v: 2, sid: (F.id || "seance") + ":" + S.profil, pid: F.id || "", title: F.t, profil: S.profil,
    pn: monProfil().nom, owner: S.profil === profils()[0].id, finishedAt: S.stop ? S.stop.at : Date.now(),
    ex: garderQuarante(ex2.filter(e => e.done > 0 || e.sets > 0), echauffement),
  };
  if (S.stop) bilan.dl = S.stop.z;  // 🆘 : bilan partiel marqué « douleur »
  return bilan;
}

// 40 lignes au plus (le bot refuse au-delà) : un gros circuit (une ligne par variante et par
// poste) ne doit jamais faire disparaître la vraie muscu. On garde la muscu, puis le circuit.
function garderQuarante(liste, echauffement) {
  if (liste.length <= 40) return liste;
  const muscu = liste.filter(e => !echauffement.has(e));
  const garde = new Set(muscu.concat(liste.filter(e => echauffement.has(e)).slice(0, Math.max(0, 40 - muscu.length))));
  return liste.filter(e => garde.has(e)).slice(0, 40);
}

// Ce qui part vraiment par sendData : au plus 4 096 octets. Trop long (accents, grosse séance de
// groupe) : forme compacte (clés courtes, sans les noms), dépliée par le bot (bilan_seance.py).
function octets(t) { return new TextEncoder().encode(t).length; }
function donneesEnvoi(bilan) {
  let t = JSON.stringify(bilan);
  if (octets(t) <= MAX_ENVOI) return t;
  const c = { v: 2, c: 1, sid: bilan.sid, pid: bilan.pid, pr: bilan.profil, o: bilan.owner ? 1 : 0, f: bilan.finishedAt };
  if (bilan.dl) c.dl = bilan.dl;
  const ligne = (e, detail) => [e.id, e.e, e.sets, e.done, e.reps, e.sec, e.k, e.t || 0, e.tn || 0, e.kg || 0].concat(detail ? [detail] : []);
  const essai = (detail) => { c.x = bilan.ex.map(e => ligne(e, detail(e))); return JSON.stringify(c); };
  t = essai(e => e.ss);
  if (octets(t) <= MAX_ENVOI) return t;
  t = essai(e => e.ss && e.ss.map(s => s[2] || "-").join(""));  // seulement le ressenti de chaque série
  if (octets(t) <= MAX_ENVOI) return t;
  t = essai(() => null);
  if (octets(t) > MAX_ENVOI) { c.x = c.x.filter(x => x[3] > 0); t = JSON.stringify(c); }
  while (octets(t) > MAX_ENVOI && c.x.length > 1) { c.x.pop(); t = JSON.stringify(c); }
  return t;
}

// Bilan en texte, à copier (l'invité garde le sien, rien ne part dans l'app d'Adj).
function texteBilan() {
  const b = construireBilan(true), moi = monProfil();
  const l = ["💪 " + F.t + " — " + moi.emoji + " " + moi.nom + (S.stop ? " (arrêtée : " + nomZone(S.stop.z).toLowerCase() + ")" : "")];
  b.ex.filter(e => e.done > 0).forEach(e => {
    const series = e.ss && e.ss.length ? " (" + e.ss.map(x => x[0] + (x[1] ? "×" + x[1] + "kg" : "") + (x[2] && DIFS[x[2]] ? " " + DIFS[x[2]][0] : "")).join(", ") + ")" : "";
    l.push("• " + (e.nc || e.name) + " : " + e.done + "/" + e.sets + " séries, " + (e.k === "s" ? e.sec + " s" : e.reps + " reps") +
      (e.kg ? ", " + e.kg + " kg" : "") + series);
  });
  return l.join("\n");
}
async function copier(texte) {
  try { await navigator.clipboard.writeText(texte); return true; } catch (e) {}
  try {
    const t = document.createElement("textarea"); t.value = texte; t.setAttribute("readonly", ""); t.style.position = "fixed"; t.style.opacity = "0";
    document.body.appendChild(t); t.select(); const ok = document.execCommand("copy"); t.remove(); return ok;
  } catch (e) { return false; }
}

// Verrou d'envoi, gardé à part (survit à « Recommencer à zéro ») : {sid: date}.
function envoiFait(sid) { return !!(lireLocal("seance:envois") || {})[sid]; }
function noterEnvoi(sid) {
  const l = lireLocal("seance:envois") || {}; l[sid] = Date.now();
  const garde = {};
  Object.keys(l).sort((a, b) => l[b] - l[a]).slice(0, 30).forEach(k => { garde[k] = l[k]; });
  ecrireLocal("seance:envois", garde);
}
function envoyerATelegram(donnees) {
  if (tg) return tg.sendData(donnees);  // Telegram ferme la page après l'envoi
  if (pont) {
    if (octets(donnees) > MAX_ENVOI) throw new Error("bilan trop long");
    return pont.postEvent("web_app_data_send", JSON.stringify({ data: donnees }));
  }
  throw new Error("hors de Telegram");
}
function envoyerBilan(bilan) {
  const donnees = donneesEnvoi(bilan);
  try {
    envoyerATelegram(donnees);
    noterEnvoi(bilan.sid); retirerAttente(bilan.sid);
    return true;
  } catch (e) {
    // Hors de Telegram, script Telegram absent, refus : le bilan reste dans le téléphone et
    // « Renvoyer » est proposé à la prochaine ouverture (étape 8.1).
    garderEnAttente(bilan.sid, donnees, bilan.title); montrerAttente();
    const zone = document.getElementById("copie");
    if (zone) zone.innerHTML = '<p class="sous">⚠️ Pas envoyé (' + esc(e.message) + ") : ton bilan est gardé sur ce téléphone. « Renvoyer » te sera proposé à la prochaine ouverture de 💪 Séance.</p>";
    return false;
  }
}

// Bilans pas encore partis : {sid: {d: texte prêt à envoyer, t: titre, at: date}} (5 au plus).
function attentes() { const a = lireLocal("seance:attente"); return a && typeof a === "object" ? a : {}; }
function garderEnAttente(sid, donnees, titre) {
  const a = attentes(), garde = {};
  a[sid] = { d: donnees, t: String(titre || "Séance").slice(0, 80), at: Date.now() };
  Object.keys(a).sort((x, y) => a[y].at - a[x].at).slice(0, 5).forEach(k => { garde[k] = a[k]; });
  ecrireLocal("seance:attente", garde);
}
function retirerAttente(sid) { const a = attentes(); if (a[sid]) { delete a[sid]; ecrireLocal("seance:attente", a); } }
function montrerAttente() {
  const zone = $("#attente"); if (!zone) return;
  const a = attentes(), cles = Object.keys(a).filter(k => a[k] && typeof a[k].d === "string").sort((x, y) => a[y].at - a[x].at);
  if (!cles.length) { zone.innerHTML = ""; return; }
  const sid = cles[0], x = a[sid];
  let quand = "";
  try { quand = new Date(x.at).toLocaleString("fr-FR", { weekday: "long", hour: "2-digit", minute: "2-digit" }); } catch (e) {}
  zone.innerHTML = '<div class="carte alerte"><b>📤 Bilan pas encore parti</b><br><span class="sous">« ' + esc(x.t) + " »" + (quand ? " · " + esc(quand) : "") +
    (cles.length > 1 ? " · et " + (cles.length - 1) + " autre(s)" : "") + "</span>" +
    (canal() ? '<button class="gros" id="renvoyer-attente">📤 Renvoyer à Marion</button>'
      : '<p class="sous">Rouvre la page par le bouton 💪 Séance du clavier (avec un peu de réseau) pour le renvoyer.</p>') + "</div>";
  const b = document.getElementById("renvoyer-attente");
  if (b) b.onclick = () => {
    try { envoyerATelegram(x.d); noterEnvoi(sid); retirerAttente(sid); } catch (e) { /* toujours gardé */ }
    montrerAttente();
  };
}

// ------------------------------------------------------------------ repos
let minuteur = null;
function fermerRepos() { clearInterval(minuteur); minuteur = null; $("#repos").classList.remove("ouvert"); }
function repos(secondes, suite, titre) {
  if (!secondes) { suite(); return; }
  const box = $("#repos"); let fin = Date.now() + secondes * 1000;
  $("#repos-titre").textContent = titre || "Repos";
  const maj = () => {
    const reste = (fin - Date.now()) / 1000;
    $("#repos-chrono").textContent = mmss(reste);
    if (reste <= 0) { arreter(); vibre("success"); bip(); suite(); }
  };
  const arreter = fermerRepos;
  $("#repos-plus").onclick = () => { fin += 15000; maj(); };
  $("#repos-passer").onclick = () => { arreter(); suite(); };
  box.classList.add("ouvert"); maj(); minuteur = setInterval(maj, 250);
}
function texteSuite(sc) {
  const b = bloc(sc);
  if (sc.k === "x") { const n = (S.series[cleEcran(sc)] || []).length, d = b.d[S.profil] || b.d[profils()[0].id]; return n < d.s ? "Prochaine : série " + (n + 1) + "/" + d.s : "Prochain exercice"; }
  if (sc.k === "s") return "Prochain superset";
  return "Tour suivant";
}

// ------------------------------------------------------------------ actions
function aller(i) { S.idx = Math.max(0, Math.min(ECRANS.length - 1, i)); S.saisie = {}; sauver(); rendre(); }
function brancher(sc) {
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
  on("prec", () => aller(S.idx - 1));
  on("suiv", () => aller(S.idx + 1));
  on("go", () => aller(Math.max(1, S.idx)));
  on("raz", () => { const p = S.profil; S = nouvelEtat(); S.profil = p; sauver(); rendre(); });
  document.querySelectorAll("[data-profil]").forEach(el => el.onclick = () => { S.profil = el.dataset.profil; sauver(); rendre(); });
  document.querySelectorAll("[data-item]").forEach(el => el.onclick = () => {
    const k = cleEcran(sc), i = +el.dataset.item, l = S.coches[k] || (S.coches[k] = []);
    const pos = l.indexOf(i); if (pos >= 0) l.splice(pos, 1); else l.push(i); sauver(); rendre();
  });
  on("fait", () => aller(S.idx + 1));
  on("tour", () => {
    S.tours[cleEcran(sc)] = Date.now(); sauver(); vibre("success");
    repos(bloc(sc).r, () => aller(S.idx + 1), "Repos avant le tour suivant");
    $("#repos-suite").textContent = texteSuite(sc);
  });
  on("alt", () => { const k = cleEcran(sc); S.alt[k] = !S.alt[k]; S.saisie = {}; sauver(); rendre(); });
  document.querySelectorAll("[data-pas]").forEach(el => el.onclick = () => {
    const [champ, pas] = el.dataset.pas.split(":"); const d = bloc(sc).d[S.profil] || bloc(sc).d[profils()[0].id];
    if (champ === "reps") S.saisie.reps = Math.max(0, (S.saisie.reps || 0) + (d.u === "s" ? 5 : 1) * Math.sign(+pas));
    else S.saisie.kg = S.saisie.kg == null ? 20 : Math.max(0, Math.round((S.saisie.kg + (+pas)) * 10) / 10);
    rendre();
  });
  on("serie", () => validerSerie(sc));
  document.querySelectorAll("[data-dif]").forEach(el => el.onclick = () => validerSerie(sc, el.dataset.dif));
  on("suivant", () => aller(S.idx + 1));
  on("envoyer", () => { envoyerBilan(construireBilan()); });
  on("renvoyer", () => { envoyerBilan(construireBilan()); });
  on("copier", async () => {
    const t = texteBilan(), ok = await copier(t), zone = document.getElementById("copie");
    if (zone) zone.innerHTML = ok ? '<p class="sous">✅ Copié : colle-le dans ton chat.</p>' : '<pre style="white-space:pre-wrap;font-size:13px;user-select:all">' + esc(t) + "</pre>";
  });
  on("reprendre", () => { const i = S.stop ? S.stop.idx : S.idx; S.stop = null; aller(i || 1); });
  on("tenir", () => {
    vibre("success");
    repos(S.saisie.reps || 30, () => { const b = document.getElementById("serie"); if (b) b.click(); }, "Tiens bon 🔥");
    $("#repos-suite").textContent = "La série se valide toute seule à la fin";
  });
}

// Série validée : reps et kg réglés au-dessus, ressenti (dif) touché par la personne.
function validerSerie(sc, dif) {
  const k = cleEcran(sc), l = S.series[k] || (S.series[k] = []);
  const e = sc.k === "x" ? exerciceCourant(sc) : null;
  const f = { at: Date.now() };
  if (sc.k === "x") {
    f.reps = S.saisie.reps;
    if (dif && DIFS[dif]) f.dif = dif;
    if (S.saisie.kg != null && avecCharge(e)) { f.kg = S.saisie.kg; S.charges[cleCharge(e)] = { kg: f.kg }; CHARGES[cleCharge(e)] = { kg: f.kg }; ecrireLocal("seance:charges", CHARGES); }
  }
  l.push(f); S.saisie = { reps: f.reps, kg: f.kg }; sauver(); vibre("success");
  const d = bloc(sc).d[S.profil] || bloc(sc).d[profils()[0].id], total = sc.k === "x" ? d.s : d[0].s;
  if (l.length >= total) { repos(bloc(sc).r, () => aller(S.idx + 1), "Repos avant la suite"); }
  else { rendre(); repos(bloc(sc).r, rendre, "Repos"); $("#repos-suite").textContent = texteSuite(sc); return; }
  $("#repos-suite").textContent = "Prochain exercice";
}

// 🆘 Stop / douleur : toujours visible. La zone choisie arrête la séance et prévient Marion
// (bilan partiel marqué « douleur » : elle ne prescrit plus de sport aujourd'hui).
function brancherStop() {
  $("#stop-zones").innerHTML = ZONES.map(z => '<button data-zone="' + z[0] + '">' + esc(z[1]) + "</button>").join("");
  $("#sos").onclick = () => { vibre("warning"); $("#stop").classList.add("ouvert"); };
  $("#stop-annuler").onclick = () => $("#stop").classList.remove("ouvert");
  document.querySelectorAll("[data-zone]").forEach(el => el.onclick = () => arreterSeance(el.dataset.zone));
}
function marquerStop(zone) {
  S.stop = { z: ZONES.some(x => x[0] === zone) ? zone : "autre", at: Date.now(), idx: S.idx };
  S.idx = ECRANS.length - 1; S.saisie = {};
}
function arreterSeance(zone) {
  $("#stop").classList.remove("ouvert"); fermerRepos();
  marquerStop(zone); sauver(); rendre();
  const bilan = construireBilan();
  if (!envoiFait(bilan.sid)) envoyerBilan(bilan);  // hors de Telegram : gardé pour plus tard
}

// Test seulement (&simuler=1) : tout validé à la dose prévue, charge 30 kg sur les appareils.
function simuler() {
  const t = Date.now();
  ECRANS.forEach(sc => {
    if (sc.k === "c") S.tours[cleEcran(sc)] = t;
    if (sc.k === "x") {
      const d = bloc(sc).d[S.profil], e = exerciceCourant(sc);
      S.series[cleEcran(sc)] = Array.from({ length: d.s }, () => Object.assign({ reps: Math.max(d.a, d.z || 0), at: t }, d.u === "s" ? {} : { dif: "c" }, avecCharge(e) ? { kg: 30 } : {}));
    }
    if (sc.k === "s") S.series[cleEcran(sc)] = Array.from({ length: bloc(sc).d[S.profil][0].s }, () => ({ at: t }));
  });
}

function nouvelEtat() { return { idx: 0, profil: null, series: {}, tours: {}, coches: {}, alt: {}, charges: {}, saisie: {}, debut: Date.now(), maj: Date.now() }; }

// ------------------------------------------------------------------ démarrage
(async function () {
  montrerAttente();  // un bilan resté dans le téléphone : « Renvoyer » tout de suite, même sans séance
  installerHorsLigne();
  try {
    if (tg) { tg.ready(); tg.expand(); try { document.documentElement.dataset.theme = tg.colorScheme; } catch (e) {} }
    F = await lireFiche();
    if (!F || F.v !== 2 || !Array.isArray(F.e) || !Array.isArray(F.p) || !F.p.length) throw new Error("Séance illisible : redemande-la à Marion.");
    nettoyer(F);
    document.title = F.t || "Séance Marion";
    ECRANS = construireEcrans();
    cle = "seance:" + (F.id || F.t);
    S = Object.assign(nouvelEtat(), lireLocal(cle) || {});
    S.saisie = {};
    const ps = profils();
    if (params.get("profil") && ps.some(p => p.id === params.get("profil"))) S.profil = params.get("profil");
    if (!S.profil || !ps.some(p => p.id === S.profil)) S.profil = ps[0].id;
    if (params.get("ecran")) S.idx = Math.max(0, Math.min(ECRANS.length - 1, +params.get("ecran")));
    if (params.get("simuler")) simuler();
    if (params.get("stop")) marquerStop(params.get("stop"));  // test seulement : 🆘 déjà touché
    brancherStop();
    garderEcranAllume();
    rendre();
    if (params.get("repos")) { repos(+params.get("repos"), rendre, "Repos"); $("#repos-suite").textContent = texteSuite(ECRANS[S.idx]); }
  } catch (e) {
    $("#app").innerHTML = '<div class="erreur"><h2>😕 Séance introuvable</h2><p>' + esc(e.message) + "</p></div>";
  }
})();
</script>
